[project]
name = "sqa"
version = "0.1.0"
description = "Security questionnaire automation API and worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "structlog>=24.4",
    "redis>=5.2",
    "arq>=0.26",
    "svix>=1.40",
    "pymupdf>=2.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "boto3>=1.43.122",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "fakeredis>=2.26",
    "cryptography>=43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqa"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]  # SQL in tests is built from constants
"alembic/**" = ["S608"]
"src/sqa/services/demo_documents.py" = ["E501"]  # sample prose

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["sqa"]

[[tool.mypy.overrides]]
module = ["arq.*", "svix.*", "pgvector.*", "fakeredis.*", "boto3.*", "botocore.*", "docx.*", "openpyxl.*", "pymupdf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyMuPDF ships partial annotations.
module = ["sqa.ingestion.pdf", "sqa.services.demo_documents"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    "error",
    # FastAPI's TestClient re-export; harmless until we move to httpx2.
    "ignore:Using `httpx` with `starlette.testclient`",
]
markers = [
    "db: requires a real PostgreSQL with pgvector (TEST_DATABASE_URL)",
]
